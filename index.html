<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pope Map</title>
  <meta name="description" content="A map tour of places connected to the popes, with the history of the papacy.">
  <style>
    :root { --bg: #faf7f0; --fg: #2b2622; --muted: #6b625a; --accent: #a8842c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1a17; --fg: #f1ece3; --muted: #a9a094; --accent: #d4b25a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--fg);
      font-family: Georgia, "Times New Roman", serif; text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 .5rem; }
    .rule { width: 64px; height: 2px; background: var(--accent); margin: 1rem auto; border: 0; }
    p { color: var(--muted); font-size: 1.125rem; max-width: 32rem; margin: 0 auto; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Pope Map</h1>
    <hr class="rule">
    <p>A map tour of the places connected to the popes, with the history of the papacy. Coming soon.</p>
  </main>
</body>
</html>
